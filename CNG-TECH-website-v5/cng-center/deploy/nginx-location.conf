# Nginx server-block fragment, NOT a complete nginx.conf.
# Administrator: include inside the HTTPS server block for cngtech.ir.
# Adjust root, configure certificates/listen/server_name separately,
# and include the standard mime.types in the http block.
# Upload ONLY dist contents into the directory named below.

root /var/www/cngtech.ir/public;
index index.html;
autoindex off;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location / {
    try_files $uri $uri/ =404;
}

error_page 404 /404.html;
location = /404.html {
    internal;
}

# No SPA fallback. Configure HTTP/www redirects separately.
# Validate with nginx -t before reloading; do not replace unrelated config.
